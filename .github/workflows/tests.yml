# Runs the browser tests on every push and pull request.
# GitHub Pages deploys separately (Settings → Pages → Deploy from branch: main / root).
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: pytest -q   # app (browser) + sync + backend (fake DynamoDB) tests

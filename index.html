<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SergeT PDX</title>
  <meta name="description" content="Home of sergetpdx.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/site.css">
  <link rel="icon" href="workout_app/img/logo.svg" type="image/svg+xml">
  <style>
    main { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
    .hello { max-width: 520px; text-align: center; }
    h1 { font-size: clamp(2.2rem, 7vw, 3.4rem); font-weight: 600; margin: 0 0 8px; }
    h1 span { color: var(--mint-dark); }
    p { color: var(--ink-soft); line-height: 1.6; margin: 0 0 28px; }
    .card {
      display: flex; align-items: center; gap: 16px; text-align: left;
      padding: 16px 20px; border-radius: var(--radius); background: var(--surface);
      color: var(--ink); text-decoration: none; border: 1px solid transparent;
    }
    .card:hover { border-color: var(--mint); }
    .card img { width: 48px; height: 48px; }
    .card strong { display: block; font-weight: 500; }
    .card small { color: var(--ink-soft); }
    footer { margin-top: 40px; font-size: .8rem; color: var(--ink-faint); }
  </style>
</head>
<body>
  <main>
    <div class="hello">
      <h1>Hello, I'm <span>Serge</span>.</h1>
      <p>Welcome to sergetpdx.com, a small home base for the projects I'm building and learning from.</p>
      <a class="card" href="workout_app/">
        <img src="workout_app/img/logo.svg" alt="">
        <div>
          <strong>Workout Log</strong>
          <small>Track exercises, supersets, sets, reps and notes.</small>
        </div>
      </a>
      <footer>&copy; <span id="year"></span> SergeT PDX</footer>
    </div>
  </main>
  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
